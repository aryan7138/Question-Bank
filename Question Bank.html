/* ================= Smooth micro-interactions ================= */
html{-webkit-tap-highlight-color:transparent}
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
button,a,summary,label,input,select,textarea,details{touch-action:manipulation}
button,a,summary,input,select,textarea{transition-property:background-color,color,border-color,box-shadow,transform,opacity,filter}

@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:.35;transform:translateX(-16px)}to{opacity:1;transform:none}}

#main{scroll-behavior:smooth}
#main.anim{animation:pageIn .22s ease both}

/* buttons */
button{transition:background-color .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .12s ease,opacity .16s ease,filter .16s ease}
button:not(:disabled):active{transform:scale(.97)}
button:disabled{transform:none}
button:not(.p):not(.d):hover:not(:disabled){background:#F1F5F9;border-color:#AEBACA}
button.p:hover:not(:disabled){background:#215C9E;border-color:#215C9E;box-shadow:0 2px 8px rgba(29,78,137,.22)}
button.d:hover:not(:disabled){background:#FAEDEB;border-color:#E0B3AD}
button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

/* sidebar + tabs */
nav a,nav summary{transition:background-color .16s ease,color .16s ease,box-shadow .16s ease}
nav a:hover,nav summary:hover{background:#F1F5F9}
nav a.on{box-shadow:inset 3px 0 var(--ac)}
.tabs a{transition:color .16s ease,border-color .16s ease,background-color .16s ease}
.tabs a:hover{color:var(--ac);background:#F4F7FB}

/* surfaces */
.card{transition:box-shadow .2s ease,border-color .2s ease}
.rw{transition:background-color .16s ease}
.rw:hover{background:#F6F9FC}
tbody tr{transition:background-color .16s ease}
tbody tr:hover{background:#F6F9FC}

/* fields */
input,select,textarea{transition:border-color .16s ease,box-shadow .16s ease,background-color .16s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(29,78,137,.13)}
input[type=checkbox],input[type=radio]{accent-color:var(--ac);cursor:pointer;transition:transform .12s ease}
input[type=checkbox]:active,input[type=radio]:active{transform:scale(.9)}

/* top bar buttons */
#bar>*{animation:msgIn .18s ease both}

/* modal */
#md.on{display:flex;animation:fadeIn .15s ease both}
#md .mb2{animation:popIn .2s cubic-bezier(.2,.8,.3,1) both}

/* toast */
#ts{transform:translateX(-50%) translateY(10px);transition:opacity .22s ease,transform .22s ease}
#ts.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* assistant */
#zrb{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
#zrb:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.22)}
#zrb:active{transform:scale(.93)}
#zrp{transform-origin:100% 100%}
#zrp.in{animation:popIn .2s cubic-bezier(.2,.8,.3,1)}
#zrh button{transition:background-color .16s ease,transform .12s ease}
#zrh button:hover{background:#D8E5F4;border-radius:4px}
.zmsg{animation:msgIn .18s ease both}
.zfb button{transition:background-color .16s ease,border-color .16s ease,transform .12s ease}
.zfb button:active{transform:scale(.94)}
.zchips button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .12s ease}
.zchips button:hover{background:var(--hl);color:var(--ac);border-color:var(--ac)}
.zchips button:active{transform:scale(.95)}

@media(max-width:760px){body.nv nav{animation:slideIn .2s ease both}}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media print{*,*::before,*::after{animation:none!important;transition:none!important}}

const norm=s=>{s=String(s??'').toLowerCase().normalize('NFC');for(const[r,t]of FOLD)s=s.replace(r,t);return s.trim()};

const stem=t=>{if(t.length<5)return t;for(const s of SUF)if(t.length-s.length>=3&&t.endsWith(s))return t.slice(0,-s.length);return t};
const STOP=new Set(('কি কী কিভাবে কীভাবে কোথায় কোথা থেকে এর একটা একটি আমি আমার টা টি আর এবং বা না হয় হবে করব করবো করতে করা করলে দাও দেবেন পারেন পারি please the a an is are to for of in on i me my we you it this that can could would should how what where when which').split(' '));
const toks=s=>norm(s).split(' ').filter(t=>t&&!STOP.has(t)).map(stem);
const bi=s=>{const g=new Set();for(let i=0;i<s.length-1;i++)g.add(s.slice(i,i+2));return g};
const dice=(a,b)=>{const A=bi(a),B=bi(b);if(!A.size||!B.size)return a===b?1:0;let i=0;for(const x of A)if(B.has(x))i++;return 2*i/(A.size+B.size)};
const lev=(a,b)=>{if(a===b)return 0;if(Math.abs(a.length-b.length)>2)return 9;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]};
const tokSim=(a,b)=>{if(a===b)return 1;const m=Math.min(a.length,b.length);if(m>=4&&(a.includes(b)||b.includes(a)))return .9;const l=m>=4?lev(a,b):9;return Math.max(m>=3?dice(a,b):0,l<=1?1:(m>=6&&l===2)?.5:0)};
const sim=(qt,kt)=>{if(!kt.length)return 0;let s=0;for(const k of kt){let b=0;for(const q of qt)b=Math.max(b,tokSim(q,k));s+=b}return s/kt.length};
